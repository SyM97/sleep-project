name: Sleep Data Pipeline

on:
  workflow_dispatch:
    inputs:
      object_path:
        description: "Ruta del CSV dentro de sleep-datasets"
        required: true
        type: string

  repository_dispatch:
    types:
      - sleep_dataset_uploaded

permissions:
  contents: read

concurrency:
  group: sleep-data-pipeline
  cancel-in-progress: false

jobs:
  sleep-pipeline:
    name: Process Sleep Cycle dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      OBJECT_PATH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.object_path || inputs.object_path }}

    steps:

      # ======================================================
      # 1. DESCARGAR CÓDIGO
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. PREPARAR PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ======================================================
      # 3. INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install supabase


      # ======================================================
      # 4. VALIDAR RUTA DEL OBJETO
      # ======================================================

      - name: Validate Storage object path
        shell: bash
        run: |
          echo "Validating Storage object path..."

          if [ -z "$OBJECT_PATH" ]; then
            echo "ERROR: object_path is empty."
            exit 1
          fi

          case "$OBJECT_PATH" in
            incoming/*.csv)
              echo "Object path accepted:"
              echo "$OBJECT_PATH"
              ;;
            *)
              echo "ERROR: Only incoming/*.csv is allowed."
              exit 1
              ;;
          esac


      # ======================================================
      # 5. DESCARGAR CSV DESDE SUPABASE STORAGE
      # ======================================================

      - name: Download dataset from Supabase Storage
        shell: bash
        run: |
          mkdir -p data/raw

          python - <<'PY'
          import os
          from pathlib import Path
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SECRET_KEY"]
          object_path = os.environ["OBJECT_PATH"]

          if not url:
              raise RuntimeError(
                  "SUPABASE_URL is empty."
              )

          if not key:
              raise RuntimeError(
                  "SUPABASE_SECRET_KEY is empty."
              )

          print(
              "Downloading private Storage object: "
              + object_path
          )

          supabase = create_client(
              url,
              key,
          )

          data = (
              supabase.storage
              .from_("sleep-datasets")
              .download(object_path)
          )

          if not data:
              raise RuntimeError(
                  "The downloaded dataset is empty."
              )

          destination = Path(
              "data/raw/incoming_sleep_cycle.csv"
          )

          destination.write_bytes(
              data
          )

          print(
              f"Dataset downloaded successfully: "
              f"{len(data):,} bytes"
          )
          PY


      # ======================================================
      # 6. VALIDAR ARCHIVO DESCARGADO
      # ======================================================

      - name: Validate downloaded file
        shell: bash
        run: |
          test -f data/raw/incoming_sleep_cycle.csv

          FILE_SIZE=$(
            stat -c%s data/raw/incoming_sleep_cycle.csv
          )

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "ERROR: Downloaded CSV is empty."
            exit 1
          fi

          echo "CSV validation successful."
          echo "File size: $FILE_SIZE bytes"


      # ======================================================
      # 7. CREAR .env TEMPORAL
      # ======================================================

      - name: Create temporary environment file
        shell: bash
        env:
          SLEEP_ENV_FILE: ${{ secrets.SLEEP_ENV_FILE }}
        run: |
          if [ -z "$SLEEP_ENV_FILE" ]; then
            echo "ERROR: SLEEP_ENV_FILE secret is empty."
            exit 1
          fi

          printf '%s' "$SLEEP_ENV_FILE" > .env

          chmod 600 .env

          echo ".env created for this runner."


      # ======================================================
      # 8. LIMPIEZA PRELIMINAR
      #
      # Se ejecuta antes del entrenamiento para conocer:
      # - primera fecha
      # - última fecha
      # - número de sesiones válidas
      # ======================================================

      - name: Preflight clean incoming dataset
        shell: bash
        run: |
          python src/clean_sleep_data.py \
            data/raw/incoming_sleep_cycle.csv


      # ======================================================
      # 9. PROTECCIÓN CONTRA DATASETS ANTIGUOS / INCOMPLETOS
      # ======================================================

      - name: Protect Supabase from stale datasets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from pathlib import Path
          from supabase import create_client


          # --------------------------------------------------
          # Leer dataset entrante ya limpio
          # --------------------------------------------------

          clean_file = Path(
              "data/processed/sleep_sessions_clean.csv"
          )

          if not clean_file.exists():
              raise RuntimeError(
                  "Clean dataset was not generated."
              )

          df = pd.read_csv(
              clean_file,
              sep=";",
              low_memory=False,
          )

          if "sleep_date" not in df.columns:
              raise RuntimeError(
                  "sleep_date column is missing."
              )

          if "include_in_analytics" not in df.columns:
              raise RuntimeError(
                  "include_in_analytics column is missing."
              )

          df["sleep_date"] = pd.to_datetime(
              df["sleep_date"],
              errors="coerce",
          )


          # --------------------------------------------------
          # Normalizar booleano
          # --------------------------------------------------

          if pd.api.types.is_bool_dtype(
              df["include_in_analytics"]
          ):
              include_mask = (
                  df["include_in_analytics"]
                  .fillna(False)
              )

          else:
              include_mask = (
                  df["include_in_analytics"]
                  .astype(str)
                  .str.strip()
                  .str.lower()
                  .isin(
                      [
                          "true",
                          "1",
                          "yes",
                          "sí",
                          "si",
                      ]
                  )
              )


          analytics = df.loc[
              include_mask
              & df["sleep_date"].notna()
          ].copy()

          if analytics.empty:
              raise RuntimeError(
                  "Incoming dataset has no "
                  "analytical sessions."
              )


          # --------------------------------------------------
          # Metadata del dataset entrante
          # --------------------------------------------------

          incoming_first = (
              analytics["sleep_date"]
              .min()
              .date()
          )

          incoming_last = (
              analytics["sleep_date"]
              .max()
              .date()
          )

          incoming_sessions = int(
              len(analytics)
          )

          print()
          print(
              "Incoming dataset:"
          )

          print(
              f"  First date: "
              f"{incoming_first}"
          )

          print(
              f"  Last date: "
              f"{incoming_last}"
          )

          print(
              f"  Analytical sessions: "
              f"{incoming_sessions}"
          )


          # --------------------------------------------------
          # Leer estado actual de Supabase
          # --------------------------------------------------

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SECRET_KEY"],
          )

          response = (
              supabase
              .table("dashboard_kpis")
              .select(
                  "first_sleep_date,"
                  "last_sleep_date,"
                  "analytics_sessions_count"
              )
              .limit(1)
              .execute()
          )

          rows = response.data or []


          # --------------------------------------------------
          # Si la tabla está vacía, se permite la primera carga
          # --------------------------------------------------

          if not rows:

              print()
              print(
                  "No existing dashboard state found."
              )

              print(
                  "Initial database load is allowed."
              )

              raise SystemExit(0)


          current = rows[0]

          current_first = (
              pd.to_datetime(
                  current[
                      "first_sleep_date"
                  ]
              )
              .date()
          )

          current_last = (
              pd.to_datetime(
                  current[
                      "last_sleep_date"
                  ]
              )
              .date()
          )

          current_sessions = int(
              current[
                  "analytics_sessions_count"
              ]
          )

          print()
          print(
              "Current Supabase dataset:"
          )

          print(
              f"  First date: "
              f"{current_first}"
          )

          print(
              f"  Last date: "
              f"{current_last}"
          )

          print(
              f"  Analytical sessions: "
              f"{current_sessions}"
          )


          # --------------------------------------------------
          # REGLA 1
          # No permitir retroceder la última fecha
          # --------------------------------------------------

          if incoming_last < current_last:

              raise RuntimeError(
                  "DATASET BLOCKED: "
                  "incoming last date "
                  f"({incoming_last}) is older than "
                  "the current Supabase last date "
                  f"({current_last})."
              )


          # --------------------------------------------------
          # REGLA 2
          # El export debe conservar el histórico
          # --------------------------------------------------

          if incoming_first > current_first:

              raise RuntimeError(
                  "DATASET BLOCKED: "
                  "incoming dataset starts later "
                  "than the current dataset. "
                  "A complete historical export "
                  "was expected."
              )


          # --------------------------------------------------
          # REGLA 3
          # No permitir perder sesiones históricas
          # --------------------------------------------------

          if incoming_sessions < current_sessions:

              raise RuntimeError(
                  "DATASET BLOCKED: "
                  "incoming dataset contains fewer "
                  "analytical sessions "
                  f"({incoming_sessions}) than "
                  "the current Supabase dataset "
                  f"({current_sessions})."
              )


          print()
          print("=" * 72)

          print(
              "DATASET SAFETY CHECK PASSED"
          )

          print("=" * 72)

          print(
              "The incoming dataset is safe "
              "to process."
          )
          PY


      # ======================================================
      # 10. EJECUTAR PIPELINE COMPLETO
      #
      # --skip-db:
      # Primero hacemos todos los cálculos y construimos
      # la estimación histórica sin tocar Supabase.
      # ======================================================

      - name: Run sleep analytics pipeline
        shell: bash
        run: |
          python src/run_sleep_pipeline.py \
            --input-file data/raw/incoming_sleep_cycle.csv \
            --skip-db


      # ======================================================
      # 11. VALIDAR RESULTADO DEL PIPELINE
      # ======================================================

      - name: Validate pipeline result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path(
              "reports/pipeline/pipeline_run_latest.json"
          )

          if not summary_path.exists():
              raise RuntimeError(
                  "Pipeline summary was not generated."
              )

          with summary_path.open(
              "r",
              encoding="utf-8",
          ) as file:

              summary = json.load(
                  file
              )

          status = summary.get(
              "status"
          )

          print(
              f"Pipeline status: "
              f"{status}"
          )

          if status != "success":

              raise RuntimeError(
                  "Pipeline did not finish successfully."
              )

          dataset = summary.get(
              "dataset",
              {},
          )

          print(
              "Processed dataset: "
              + str(
                  dataset.get(
                      "filename",
                      "unknown",
                  )
              )
          )

          print(
              "SHA256: "
              + str(
                  dataset.get(
                      "sha256",
                      "unknown",
                  )
              )
          )
          PY


      # ======================================================
      # 12. CARGAR DASHBOARD A SUPABASE
      # ======================================================

      - name: Load dashboard to Supabase
        shell: bash
        run: |
          python src/load_dashboard_to_supabase.py \
            --yes


      # ======================================================
      # 13. CARGAR TIPO DE SUEÑO A SUPABASE
      # ======================================================

      - name: Load sleep type prediction to Supabase
        shell: bash
        run: |
          python src/load_sleep_type_prediction_to_supabase.py


      # ======================================================
      # 14. VERIFICACIÓN POST-CARGA
      # ======================================================

      - name: Verify Supabase update
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from pathlib import Path
          from supabase import create_client


          # --------------------------------------------------
          # Estado esperado del dashboard
          # --------------------------------------------------

          kpi_file = Path(
              "data/dashboard/dashboard_kpis.csv"
          )

          if not kpi_file.exists():
              raise RuntimeError(
                  "dashboard_kpis.csv was not generated."
              )

          kpi = pd.read_csv(
              kpi_file,
              sep=";",
          ).iloc[0]

          expected_dashboard_date = str(
              pd.to_datetime(
                  kpi[
                      "last_sleep_date"
                  ]
              )
              .date()
          )


          # --------------------------------------------------
          # Predicción histórica esperada
          # --------------------------------------------------

          prediction_file = Path(
              "data/prediction/sleep_type_prediction.csv"
          )

          if not prediction_file.exists():
              raise RuntimeError(
                  "sleep_type_prediction.csv was not generated."
              )

          prediction = pd.read_csv(
              prediction_file,
              sep=";",
          ).iloc[0]

          expected_as_of_date = str(
              pd.to_datetime(
                  prediction[
                      "as_of_date"
                  ]
              )
              .date()
          )

          expected_target_date = str(
              pd.to_datetime(
                  prediction[
                      "target_date"
                  ]
              )
              .date()
          )

          expected_sleep_type = str(
              prediction[
                  "predicted_sleep_type"
              ]
          ).strip()

          expected_probability_pct = float(
              prediction[
                  "probability_pct"
              ]
          )

          expected_historical_nights = int(
              prediction[
                  "historical_nights"
              ]
          )

          if (
              expected_as_of_date
              != expected_dashboard_date
          ):
              raise RuntimeError(
                  "Prediction as_of_date does not match "
                  "dashboard last_sleep_date. "
                  f"Dashboard: {expected_dashboard_date}. "
                  f"Prediction: {expected_as_of_date}."
              )


          # --------------------------------------------------
          # Cliente Supabase
          # --------------------------------------------------

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SECRET_KEY"],
          )


          # --------------------------------------------------
          # Verificar dashboard
          # --------------------------------------------------

          dashboard_response = (
              supabase
              .table("dashboard_kpis")
              .select(
                  "last_sleep_date"
              )
              .limit(1)
              .execute()
          )

          dashboard_rows = (
              dashboard_response.data
              or []
          )

          if not dashboard_rows:

              raise RuntimeError(
                  "dashboard_kpis is empty "
                  "after database load."
              )

          database_date = str(
              dashboard_rows[0][
                  "last_sleep_date"
              ]
          )

          if (
              database_date
              != expected_dashboard_date
          ):

              raise RuntimeError(
                  "Dashboard verification failed. "
                  f"Expected {expected_dashboard_date}, "
                  f"found {database_date}."
              )


          # --------------------------------------------------
          # Verificar predicción de tipo de sueño
          # --------------------------------------------------

          prediction_response = (
              supabase
              .table(
                  "sleep_type_predictions"
              )
              .select(
                  "as_of_date,"
                  "target_date,"
                  "predicted_sleep_type,"
                  "probability_pct,"
                  "prediction_method,"
                  "historical_nights"
              )
              .eq(
                  "as_of_date",
                  expected_as_of_date,
              )
              .limit(1)
              .execute()
          )

          prediction_rows = (
              prediction_response.data
              or []
          )

          if not prediction_rows:

              raise RuntimeError(
                  "Sleep type prediction verification failed. "
                  f"No row found for {expected_as_of_date}."
              )

          stored_prediction = (
              prediction_rows[0]
          )

          database_target_date = str(
              stored_prediction[
                  "target_date"
              ]
          )

          database_sleep_type = str(
              stored_prediction[
                  "predicted_sleep_type"
              ]
          )

          database_probability_pct = float(
              stored_prediction[
                  "probability_pct"
              ]
          )

          database_method = str(
              stored_prediction[
                  "prediction_method"
              ]
          )

          database_historical_nights = int(
              stored_prediction[
                  "historical_nights"
              ]
          )

          if (
              database_target_date
              != expected_target_date
          ):
              raise RuntimeError(
                  "Sleep type target_date verification failed. "
                  f"Expected {expected_target_date}, "
                  f"found {database_target_date}."
              )

          if (
              database_sleep_type
              != expected_sleep_type
          ):
              raise RuntimeError(
                  "Sleep type verification failed. "
                  f"Expected {expected_sleep_type}, "
                  f"found {database_sleep_type}."
              )

          if abs(
              database_probability_pct
              - expected_probability_pct
          ) > 0.01:
              raise RuntimeError(
                  "Sleep type probability verification failed. "
                  f"Expected {expected_probability_pct:.2f}, "
                  f"found {database_probability_pct:.2f}."
              )

          if (
              database_method
              != "historical_frequency"
          ):
              raise RuntimeError(
                  "Unexpected prediction method: "
                  f"{database_method}."
              )

          if (
              database_historical_nights
              != expected_historical_nights
          ):
              raise RuntimeError(
                  "Historical night count verification failed. "
                  f"Expected {expected_historical_nights}, "
                  f"found {database_historical_nights}."
              )


          print()
          print("=" * 72)

          print(
              "SUPABASE UPDATE VERIFIED"
          )

          print("=" * 72)

          print(
              f"Dashboard latest date: "
              f"{database_date}"
          )

          print(
              f"Next night: "
              f"{database_target_date}"
          )

          print(
              f"Sleep type: "
              f"{database_sleep_type.upper()}"
          )

          print(
              f"Historical probability: "
              f"{database_probability_pct:.2f} %"
          )
          PY


      # ======================================================
      # 15. LIMPIEZA FINAL
      # ======================================================

      - name: Remove temporary sensitive files
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -f data/raw/incoming_sleep_cycle.csv

          echo "Temporary sensitive files removed."
